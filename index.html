<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>小红书封面工厂 (V8.0 杂志美学版)</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        body { font-family: -apple-system, "Songti SC", "SimSun", serif; background: #f0f2f5; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.05); }
        h1 { color: #333; margin-top: 0; font-weight: 800; letter-spacing: -1px; }
        .highlight { color: #ff2442; }
        
        .step { margin-bottom: 25px; padding: 20px; background: #fafafa; border-radius: 12px; border: 1px solid #eee; }
        
        #previewBox {
            background: #fff; border: 1px solid #ddd; padding: 15px;
            margin-top: 10px; border-radius: 8px; font-family: sans-serif; font-size: 13px;
            color: #666;
        }

        #logArea { 
            background: #222; color: #fff; font-family: monospace; 
            padding: 15px; height: 150px; overflow-y: auto; 
            border-radius: 8px; font-size: 12px; margin-bottom: 20px;
        }

        .btn { background: #ff2442; color: white; border: none; padding: 18px 40px; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; width: 100%; transition: 0.3s; }
        .btn:disabled { background: #e0e0e0; color:#999; cursor: not-allowed; }
        .btn:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(255, 36, 66, 0.2); }
        
        .encoding-select { padding: 8px; margin-left: 10px; border-radius: 6px; border: 1px solid #ccc; }
        
        /* 选项开关 */
        .option-row { display: flex; gap: 20px; margin-top: 10px; }
        .checkbox-label { display: flex; align-items: center; gap: 5px; font-size: 14px; cursor: pointer; user-select: none;}
    </style>
</head>
<body>

<div class="container">
    <h1>✨ 封面工厂 <span class="highlight">V8.0 杂志美学版</span></h1>
    <p style="color:#666; margin-bottom:30px;">自动裁切掉两边的广告文字，打造纯净的电影感封面。</p>
    
    <div class="step">
        <h3>1. 上传 CSV 表格 
            <select id="encodingOpt" class="encoding-select">
                <option value="GBK" selected>GBK (推荐)</option>
                <option value="UTF-8">UTF-8</option>
            </select>
        </h3>
        <input type="file" id="csvFile" accept=".csv" onclick="this.value=null" style="display:block; width:100%; padding:10px;">
        <div id="previewBox">等待上传...</div>
    </div>

    <div class="step">
        <h3>2. 选择图片文件夹</h3>
        <input type="file" id="imageFolder" webkitdirectory directory multiple onclick="this.value=null" style="display:block; width:100%; padding:10px;">
    </div>
    
    <div class="step">
        <h3>3. 美化选项</h3>
        <div class="option-row">
            <label class="checkbox-label">
                <input type="checkbox" id="cropMode" checked> ✂️ 自动裁切 (去黑边/去广告)
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="cleanText" checked> 🧹 自动清理标题乱码(??/SOS)
            </label>
        </div>
    </div>

    <div id="logArea">系统就绪。</div>
    <button id="startBtn" class="btn" disabled>🎨 生成杂志风封面</button>
</div>

<canvas id="hiddenCanvas" width="1080" height="1440" style="display:none;"></canvas>

<script>
    const logArea = document.getElementById('logArea');
    const previewBox = document.getElementById('previewBox');
    const startBtn = document.getElementById('startBtn');
    const canvas = document.getElementById('hiddenCanvas');
    const ctx = canvas.getContext('2d');
    const encodingSelect = document.getElementById('encodingOpt');

    let csvData = [];
    let imageMap = {}; 

    function log(msg) {
        logArea.innerHTML += `<div>> ${msg}</div>`;
        logArea.scrollTop = logArea.scrollHeight;
    }

    // 智能文件名清洗
    function cleanFileName(path) {
        if (!path) return "";
        let name = path.replace(/\\/g, '/').split('/').pop();
        return name.replace(/"/g, '').trim();
    }

    // 标题清洗工具
    function cleanTitleText(text) {
        if (!document.getElementById('cleanText').checked) return text;
        // 去除 ??, SOS, 【】, 以及开头结尾的非中文符号
        let clean = text.replace(/\?\?/g, "")
                        .replace(/SOS/ig, "")
                        .replace(/【.*?】/g, "")
                        .replace(/[^\u4e00-\u9fa5a-zA-Z0-9]$/, ""); 
        return clean.trim();
    }

    encodingSelect.addEventListener('change', () => {
        csvData = [];
        previewBox.innerHTML = "🔄 编码已切换，请重新上传文件...";
    });

    // 1. CSV 处理
    document.getElementById('csvFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(evt) {
            const text = evt.target.result;
            if (text.substring(0, 10).includes("PK")) { alert("请上传CSV格式！"); return; }
            
            const lines = text.split('\n').filter(line => line.trim() !== "");
            let previewText = "📋 预览:\n";
            for(let i=0; i<Math.min(3, lines.length); i++) previewText += `[${i+1}] ${lines[i].substring(0, 50)}\n`;
            previewBox.innerText = previewText;

            csvData = [];
            lines.forEach(row => {
                let cols = row.split(',');
                if (cols.length >= 2) {
                    csvData.push({
                        matchKey: cleanFileName(cols[0]), 
                        title: (cols[1] || "").replace(/"/g, '').trim(),
                        tag1: (cols[2] || "").replace(/"/g, '').trim(),
                        tag2: (cols[3] || "").replace(/"/g, '').trim()
                    });
                }
            });
            log(`✅ 表格加载：${csvData.length} 条`);
            checkReady();
        };
        reader.readAsText(file, encodingSelect.value);
    });

    // 2. 文件夹处理
    document.getElementById('imageFolder').addEventListener('change', function(e) {
        const files = e.target.files;
        imageMap = {};
        let count = 0;
        for (let i = 0; i < files.length; i++) {
            if (files[i].type.startsWith('image/')) {
                imageMap[cleanFileName(files[i].name)] = files[i];
                count++;
            }
        }
        log(`📂 图片加载：${count} 张`);
        checkReady();
    });

    function checkReady() {
        if (csvData.length > 0 && Object.keys(imageMap).length > 0) {
            startBtn.disabled = false;
        }
    }

    // 3. 开始生成
    startBtn.addEventListener('click', async function() {
        startBtn.disabled = true;
        startBtn.innerHTML = "⏳ 正在进行杂志排版...";
        const zip = new JSZip();
        const folder = zip.folder("小红书杂志风封面");
        let success = 0;
        const isCrop = document.getElementById('cropMode').checked;

        for (let i = 0; i < csvData.length; i++) {
            const item = csvData[i];
            if (imageMap[item.matchKey]) {
                try {
                    // 标题自动清洗
                    const finalTitle = cleanTitleText(item.title);
                    
                    const blob = await renderMagazineCover(imageMap[item.matchKey], finalTitle, "沉浸式观影 | 4K修复", item.tag1, item.tag2, isCrop);
                    let safeTitle = (finalTitle || "img_"+i).replace(/[\\/:*?"<>|]/g, "_");
                    folder.file(`${safeTitle}.png`, blob);
                    success++;
                } catch(e) { console.error(e); }
            }
        }
        
        if(success > 0) {
            zip.generateAsync({type:"blob"}).then(content => {
                saveAs(content, "杂志风封面_V8.zip");
                startBtn.innerHTML = "✅ 下载完成";
                startBtn.disabled = false;
            });
        } else {
            alert("生成失败，请检查文件名匹配");
            startBtn.disabled = false;
        }
    });

    // --- 🎨 V8.0 核心引擎：杂志美学风 ---
    function renderMagazineCover(file, title, subtitle, tag1, tag2, isCrop) {
        return new Promise(resolve => {
            const img = new Image();
            img.onload = () => {
                // 清布
                ctx.clearRect(0, 0, 1080, 1440);

                // 1. 背景：柔和的高级灰渐变
                const grad = ctx.createLinearGradient(0, 0, 0, 1440);
                grad.addColorStop(0, "#eef1f5");
                grad.addColorStop(1, "#dce4eb");
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 1080, 1440);

                // 2. 绘制 iPad 样机 (稍微缩小一点，留白更有呼吸感)
                const padW = 860; 
                const padH = 645; // 4:3
                const padX = (1080 - padW) / 2;
                const padY = 380; // 下移，给标题留更多空间

                // 阴影 (柔和弥散光)
                ctx.save();
                ctx.shadowColor = "rgba(0,0,0,0.15)";
                ctx.shadowBlur = 60;
                ctx.shadowOffsetY = 30;
                ctx.fillStyle = "#fff";
                roundRect(ctx, padX, padY, padW, padH, 20, true);
                ctx.restore();

                // 屏幕黑边
                ctx.fillStyle = "#111";
                roundRect(ctx, padX+8, padY+8, padW-16, padH-16, 16, true);

                // 屏幕显示区域
                const sx = padX + 24;
                const sy = padY + 24;
                const sw = padW - 48;
                const sh = padH - 48;

                ctx.save();
                roundRect(ctx, sx, sy, sw, sh, 8, false);
                ctx.clip();

                if (isCrop) {
                    // 🔥 核心：裁切模式 (Object-Fit: Cover)
                    // 这样会自动切掉左右两边的文字，只保留中间画面！
                    drawImageCover(ctx, img, sx, sy, sw, sh);
                } else {
                    // 完整模式 (Fit)
                    ctx.fillStyle="#000"; ctx.fillRect(sx,sy,sw,sh);
                    drawImageProp(ctx, img, sx, sy, sw, sh);
                }

                // 视频进度条装饰 (增加细节)
                ctx.fillStyle = "rgba(0,0,0,0.4)";
                ctx.fillRect(sx, sy + sh - 60, sw, 60);
                ctx.fillStyle = "rgba(255,255,255,0.3)";
                ctx.fillRect(sx + 30, sy + sh - 30, sw - 60, 4);
                ctx.fillStyle = "#ff2442";
                ctx.fillRect(sx + 30, sy + sh - 30, sw * 0.4, 4); // 40%进度

                ctx.restore();

                // 3. 放大镜 (放在iPad边框上，作为点缀)
                // 智能判断：如果裁切了，细节更清晰，不用放太大
                const lensR = 110;
                const lensX = padX + padW - 60;
                const lensY = padY + padH - 40;

                ctx.save();
                ctx.beginPath();
                ctx.arc(lensX, lensY, lensR, 0, Math.PI*2);
                ctx.shadowColor = "rgba(0,0,0,0.2)"; ctx.shadowBlur = 20;
                ctx.strokeStyle = "#fff"; ctx.lineWidth = 8;
                ctx.stroke(); ctx.clip();

                // 放大中间部分
                const centerInfo = getDrawImagePropInfo(img, sx, sy, sw, sh);
                const zoomScale = 2.0;
                ctx.drawImage(img, centerInfo.cx - (lensR/zoomScale), centerInfo.cy - (lensR/zoomScale), lensR*2/zoomScale, lensR*2/zoomScale, lensX-lensR, lensY-lensR, lensR*2, lensR*2);
                ctx.restore();
                
                // 放大镜Tag
                drawPill(ctx, lensX - 50, lensY + 80, "✨ 超清", "#333", "#fff");

                // 4. 文字排版 (杂志风)
                ctx.textAlign = "center";
                
                // 标签 (胶囊风格)
                const tagY = 180;
                if (tag1) drawCapsule(ctx, tag1, 540 - 140, tagY, "#333", "#fff");
                if (tag2) drawCapsule(ctx, tag2, 540 + 140, tagY, "#ff2442", "#fff");

                // 主标题 (衬线体，更有电影感)
                ctx.textBaseline = "middle";
                ctx.fillStyle = "#222"; 
                // 自动缩小字号防止换行
                let fontSize = 90;
                if(title.length > 8) fontSize = 70;
                if(title.length > 12) fontSize = 60;
                
                ctx.font = `bold ${fontSize}px "Songti SC", "SimSun", serif`; 
                // 增加一点字间距
                ctx.fillText(title, 540, 300);

                // 底部副标题
                ctx.textBaseline = "bottom";
                ctx.font = "500 32px sans-serif";
                ctx.fillStyle = "#888";
                ctx.fillText(subtitle, 540, 1150);
                
                // 底部装饰线
                ctx.beginPath();
                ctx.moveTo(540 - 50, 1180);
                ctx.lineTo(540 + 50, 1180);
                ctx.strokeStyle = "#ddd";
                ctx.lineWidth = 2;
                ctx.stroke();

                canvas.toBlob(blob => resolve(blob), 'image/png');
            };
            img.src = URL.createObjectURL(file);
        });
    }

    // --- 辅助绘图函数 ---
    
    // 填充裁切 (Cover)
    function drawImageCover(ctx, img, x, y, w, h) {
        var iw = img.width, ih = img.height;
        var r = Math.max(w / iw, h / ih); // 取最大比例，保证填满
        var nw = iw * r, nh = ih * r;
        var cx = (w - nw) * 0.5, cy = (h - nh) * 0.5; // 居中
        ctx.drawImage(img, x + cx, y + cy, nw, nh); 
    }

    function roundRect(ctx, x, y, w, h, r, fill) {
        ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
        if(fill) ctx.fill(); else ctx.stroke();
    }

    function drawCapsule(ctx, text, x, y, bg, color) {
        ctx.save();
        ctx.font = "bold 26px sans-serif";
        const w = ctx.measureText(text).width + 50;
        const h = 50;
        ctx.fillStyle = bg;
        ctx.shadowColor = "rgba(0,0,0,0.1)"; ctx.shadowBlur = 10; ctx.shadowOffsetY = 5;
        ctx.beginPath(); ctx.roundRect(x - w/2, y, w, h, 25); ctx.fill();
        ctx.fillStyle = color; ctx.shadowBlur=0;
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(text, x, y + h/2 + 2);
        ctx.restore();
    }

    function drawPill(ctx, x, y, text, bg, color) {
        drawCapsule(ctx, text, x + 30, y, bg, color); // 复用逻辑
    }

    function drawImageProp(ctx, img, x, y, w, h) {
        const i = getDrawImagePropInfo(img, x, y, w, h);
        ctx.drawImage(img, i.sx, i.sy, i.sw, i.sh, i.x, i.y, i.w, i.h);
    }
    function getDrawImagePropInfo(img, x, y, w, h) {
        var iw=img.width, ih=img.height, r=Math.min(w/iw, h/ih), nw=iw*r, nh=ih*r, ar=1;
        if(nw<w) ar=w/nw; if(Math.abs(ar-1)<1e-14 && nh<h) ar=h/nh;
        nw*=ar; nh*=ar;
        var cw=iw/(nw/w), ch=ih/(nh/h), cx=(iw-cw)*0.5, cy=(ih-ch)*0.5;
        if(cx<0) cx=0; if(cy<0) cy=0; if(cw>iw) cw=iw; if(ch>ih) ch=ih;
        return {sx:cx, sy:cy, sw:cw, sh:ch, x:x, y:y, w:nw, h:nh, cx:cx, cy:cy};
    }
</script>
</body>
</html>
