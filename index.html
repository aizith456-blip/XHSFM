<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>小红书封面工厂 (V5.0 强制通过版)</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f5f5f7; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        h1 { color: #ff2442; margin-top: 0; }
        .step { margin-bottom: 25px; padding-bottom: 20px; border-bottom: 1px dashed #eee; }
        
        /* 预览区样式 */
        #previewBox {
            background: #fffbe6; border: 1px solid #ffe58f; padding: 15px;
            margin-top: 10px; border-radius: 6px; font-family: monospace; font-size: 13px;
            white-space: pre-wrap; color: #333;
        }

        #logArea { 
            background: #222; color: #0f0; font-family: monospace; 
            padding: 15px; height: 200px; overflow-y: auto; 
            border-radius: 8px; font-size: 12px; margin-bottom: 20px; 
        }

        .btn { background: #ff2442; color: white; border: none; padding: 15px 40px; border-radius: 30px; font-weight: bold; font-size: 16px; cursor: pointer; width: 100%; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .encoding-select { padding: 5px; margin-left: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏭 批量封面工厂 (V5.0 强制版)</h1>
    
    <div class="step">
        <h3>1. 上传 CSV 表格 
            <select id="encodingOpt" class="encoding-select">
                <option value="GBK" selected>编码：GBK (推荐先试这个)</option>
                <option value="UTF-8">编码：UTF-8</option>
            </select>
        </h3>
        <input type="file" id="csvFile" accept=".csv" onclick="this.value=null" style="display:block; width:100%; padding:10px;">
        
        <!-- 核心：让用户自己看 -->
        <div id="previewBox">等待上传表格...<br>请在这里确认是否显示为【正常汉字】</div>
    </div>

    <div class="step">
        <h3>2. 选择图片文件夹</h3>
        <input type="file" id="imageFolder" webkitdirectory directory multiple onclick="this.value=null" style="display:block; width:100%; padding:10px;">
    </div>

    <div id="logArea">系统就绪。</div>
    <button id="startBtn" class="btn" disabled>🚀 只要汉字正常，点我开始！</button>
</div>

<canvas id="hiddenCanvas" width="1080" height="1440" style="display:none;"></canvas>

<script>
    const logArea = document.getElementById('logArea');
    const previewBox = document.getElementById('previewBox');
    const startBtn = document.getElementById('startBtn');
    const canvas = document.getElementById('hiddenCanvas');
    const ctx = canvas.getContext('2d');
    const encodingSelect = document.getElementById('encodingOpt');

    let csvData = [];
    let imageMap = {}; 

    function log(msg, isError = false) {
        const color = isError ? '#ff4d4f' : '#0f0';
        logArea.innerHTML += `<div style="color:${color}">> ${msg}</div>`;
        logArea.scrollTop = logArea.scrollHeight;
    }

    // 切换编码时重置
    encodingSelect.addEventListener('change', () => {
        csvData = [];
        previewBox.innerHTML = "🔄 编码已切换，请【重新上传】文件以刷新预览...";
        previewBox.style.background = "#fffbe6";
        log("编码切换，请重新上传文件。");
    });

    // --- 1. CSV 处理 (不做强制拦截，只做提示) ---
    document.getElementById('csvFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const encoding = encodingSelect.value;
        const reader = new FileReader();
        
        reader.onload = function(evt) {
            const text = evt.target.result;

            // 1. 检查是不是 Excel 改名的 (二进制文件检测)
            if (text.substring(0, 10).includes("PK")) {
                alert("❌ 错误：这是 Excel 文件直接改了后缀名！\n请去 Excel 里【另存为】->【CSV】格式。");
                previewBox.innerHTML = "❌ 错误：这是二进制文件 (Excel)，请另存为 CSV。";
                previewBox.style.background = "#ffccc7";
                return;
            }

            // 2. 预览前 3 行 (让用户自己判断)
            const lines = text.split('\n').filter(line => line.trim() !== "");
            let previewText = "📋 文件内容预览 (前3行):\n";
            for(let i=0; i<Math.min(3, lines.length); i++) {
                previewText += `[第${i+1}行] ${lines[i].substring(0, 50)}\n`;
            }
            previewBox.innerText = previewText;

            // 3. 解析数据
            csvData = [];
            lines.forEach(row => {
                // 简单的逗号分割
                let cols = row.split(',');
                if (cols.length >= 2) {
                    csvData.push({
                        fullPath: cols[0].trim(),
                        title: (cols[1] || "").replace(/"/g, '').trim(),
                        tag1: (cols[2] || "").replace(/"/g, '').trim(),
                        tag2: (cols[3] || "").replace(/"/g, '').trim()
                    });
                }
            });

            // 4. 只有乱码太多才警告，但不阻止
            if (previewText.includes('')) {
                log("⚠️ 注意：预览中包含乱码符号，请确认是否选择正确的编码。", true);
                previewBox.style.background = "#fff2f0"; // 淡红警告色
            } else {
                previewBox.style.background = "#f6ffed"; // 淡绿成功色
                log(`✅ 读取正常！共 ${csvData.length} 行数据。`);
            }
            
            checkReady();
        };
        reader.readAsText(file, encoding);
    });

    // --- 2. 文件夹处理 ---
    document.getElementById('imageFolder').addEventListener('change', function(e) {
        const files = e.target.files;
        imageMap = {};
        let count = 0;
        for (let i = 0; i < files.length; i++) {
            if (files[i].type.startsWith('image/')) {
                imageMap[files[i].name] = files[i];
                count++;
            }
        }
        log(`📂 图片索引完成: ${count} 张`);
        checkReady();
    });

    function checkReady() {
        if (csvData.length > 0 && Object.keys(imageMap).length > 0) {
            startBtn.disabled = false;
            startBtn.innerHTML = `🚀 开始生成 (${csvData.length} 张)`;
        }
    }

    // --- 3. 生成逻辑 ---
    startBtn.addEventListener('click', async function() {
        if (typeof JSZip === 'undefined') { alert("组件未加载，请刷新"); return; }
        
        startBtn.disabled = true;
        startBtn.innerHTML = "⏳ 处理中...";
        const zip = new JSZip();
        const folder = zip.folder("小红书批量封面");
        let success = 0;

        for (let i = 0; i < csvData.length; i++) {
            const item = csvData[i];
            // 容错：去除文件名里的引号和空格
            let fname = item.fullPath.split('\\').pop().split('/').pop().replace(/"/g, '').trim();
            
            if (imageMap[fname]) {
                try {
                    const blob = await renderCover(imageMap[fname], item.title, "网盘直发 | 4K修复", item.tag1, item.tag2);
                    // 文件名处理：防止非法字符报错
                    let safeTitle = (item.title || "img_"+i).replace(/[\\/:*?"<>|]/g, "_");
                    folder.file(`${safeTitle}.png`, blob);
                    success++;
                } catch(e) { console.error(e); }
            }
        }

        if (success > 0) {
            zip.generateAsync({type:"blob"}).then(content => {
                saveAs(content, "批量封面_V5.zip");
                startBtn.innerHTML = "✅ 下载完成";
                startBtn.disabled = false;
            });
        } else {
            alert("❌ 0 张成功！\n\n请检查：CSV里的文件名（第1列）是否和文件夹里的图片名完全一致？");
            startBtn.disabled = false;
            startBtn.innerHTML = "❌ 失败，重试";
        }
    });

    // --- 绘图 (V5版) ---
    function renderCover(f,t,s,t1,t2){return new Promise((r)=>{const d=new FileReader();d.onload=(e)=>{const i=new Image();i.onload=()=>{draw(i,t,s,t1,t2);canvas.toBlob(r,'image/png')};i.src=e.target.result};d.readAsDataURL(f)})}
    function draw(img,title,sub,t1,t2){
        ctx.clearRect(0,0,1080,1440);
        ctx.save(); ctx.filter='blur(35px) brightness(0.65) saturate(1.2)'; drawImageProp(ctx,img,0,0,1080,1440); ctx.restore();
        const px=90,py=380,pw=900,ph=650;
        ctx.shadowColor="rgba(0,0,0,0.5)"; ctx.shadowBlur=40; ctx.shadowOffsetY=30; ctx.fillStyle="#111"; roundRect(ctx,px,py,pw,ph,24,true);
        ctx.shadowColor="transparent";
        ctx.save(); roundRect(ctx,px+18,py+18,pw-36,ph-36,8,false); ctx.clip(); drawImageProp(ctx,img,px+18,py+18,pw-36,ph-36); ctx.restore();
        const lx=540,ly=600; ctx.save(); ctx.beginPath(); ctx.arc(lx,ly,130,0,Math.PI*2); ctx.shadowColor="rgba(0,0,0,0.4)"; ctx.shadowBlur=20; ctx.lineWidth=8; ctx.strokeStyle="#fff"; ctx.stroke(); ctx.clip();
        const info=getDrawImagePropInfo(img,px+18,py+18,pw-36,ph-36); const zx=lx-((lx-info.x)/info.w)*info.w*2, zy=ly-((ly-info.y)/info.h)*info.h*2;
        ctx.filter='contrast(1.3) saturate(1.3) brightness(1.1)'; ctx.drawImage(img,info.sx,info.sy,info.sw,info.sh,zx,zy,info.w*2,info.h*2); ctx.restore();
        drawBadge(ctx,lx+90,ly+100,"🔍 细节爆炸","#ffcc00","#000");
        if(t1) drawTag(ctx,t1,px,py-35); if(t2) drawTag(ctx,t2,px+pw-200,py+ph-25);
        ctx.textAlign="center"; ctx.shadowColor="rgba(0,0,0,0.5)"; ctx.shadowBlur=15; ctx.shadowOffsetY=5;
        let fs=85; if(title.length>8) fs=65; if(title.length>12) fs=55;
        ctx.font=`bold ${fs}px -apple-system,sans-serif`; ctx.fillStyle="#fff"; ctx.fillText(title,540,250);
        ctx.font="500 32px sans-serif"; ctx.fillStyle="rgba(255,255,255,0.9)"; ctx.shadowBlur=0; ctx.fillText(sub,540,1150);
    }
    function roundRect(c,x,y,w,h,r,f){c.beginPath();c.roundRect(x,y,w,h,r);if(f)c.fill();else c.stroke()}
    function drawTag(c,t,x,y){c.save();c.font="bold 26px sans-serif";const w=c.measureText(t).width+40;c.fillStyle="rgba(255,255,255,0.2)";c.strokeStyle="rgba(255,255,255,0.3)";c.lineWidth=1;c.beginPath();c.roundRect(x,y,w,56,28);c.fill();c.stroke();c.fillStyle="#fff";c.textAlign="center";c.textBaseline="middle";c.fillText(t,x+w/2,y+30);c.restore()}
    function drawBadge(c,x,y,t,b,f){c.save();c.font="bold 22px sans-serif";const w=c.measureText(t).width+30;c.fillStyle=b;c.beginPath();c.roundRect(x,y,w,40,20);c.fill();c.fillStyle=f;c.textAlign="center";c.textBaseline="middle";c.fillText(t,x+w/2,y+22);c.restore()}
    function drawImageProp(ctx,img,x,y,w,h){const i=getDrawImagePropInfo(img,x,y,w,h);ctx.drawImage(img,i.sx,i.sy,i.sw,i.sh,i.x,i.y,i.w,i.h)}
    function getDrawImagePropInfo(img,x,y,w,h){var iw=img.width,ih=img.height,r=Math.min(w/iw,h/ih),nw=iw*r,nh=ih*r,ar=1;if(nw<w)ar=w/nw;if(Math.abs(ar-1)<1e-14&&nh<h)ar=h/nh;nw*=ar;nh*=ar;var cw=iw/(nw/w),ch=ih/(nh/h),cx=(iw-cw)*0.5,cy=(ih-ch)*0.5;if(cx<0)cx=0;if(cy<0)cy=0;if(cw>iw)cw=iw;if(ch>ih)ch=ih;return{sx:cx,sy:cy,sw:cw,sh:ch,x:x,y:y,w:nw,h:nh}}
</script>
</body>
</html>
