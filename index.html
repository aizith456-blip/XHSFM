<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>小红书封面批量工厂 (智能路径版)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f5f5f7; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        h1 { color: #ff2442; margin-top: 0; }
        .step { margin-bottom: 25px; padding-bottom: 20px; border-bottom: 1px dashed #eee; }
        .step h3 { margin: 0 0 10px 0; font-size: 16px; color: #555; }
        .upload-box { border: 2px dashed #ddd; padding: 20px; text-align: center; border-radius: 8px; cursor: pointer; transition: 0.2s; background: #fafafa; }
        .upload-box:hover { border-color: #ff2442; background: #fff0f2; }
        #logArea { background: #1e1e1e; color: #0f0; font-family: monospace; padding: 15px; height: 250px; overflow-y: auto; border-radius: 8px; font-size: 12px; margin-bottom: 20px; white-space: pre-wrap; }
        .btn { background: #ff2442; color: white; border: none; padding: 15px 40px; border-radius: 30px; font-weight: bold; font-size: 16px; cursor: pointer; width: 100%; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        #hiddenCanvas { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏭 批量封面生成工厂 (智能版)</h1>
    <p style="color:#666; font-size:13px;">适用于图片分散在不同子文件夹的情况。</p>

    <div class="step">
        <h3>1. 上传只有4列数据的 CSV 文件</h3>
        <p style="font-size:12px; color:#999;">顺序：路径 | 标题 | 标签1 | 标签2</p>
        <input type="file" id="csvFile" accept=".csv" style="display:block; width:100%; padding:10px;">
    </div>

    <div class="step">
        <h3>2. 选择包含图片的“父级文件夹”</h3>
        <p style="font-size:12px; color:#999;">例如选择 "小红书商品上传" 这个大文件夹，系统会自动扫描里面的所有子文件夹</p>
        <input type="file" id="imageFolder" webkitdirectory directory multiple style="display:block; width:100%; padding:10px;">
    </div>

    <div id="logArea">等待任务开始...</div>
    <button id="startBtn" class="btn" disabled>🚀 开始匹配并生成 ZIP</button>
</div>

<canvas id="hiddenCanvas" width="1080" height="1440"></canvas>

<script>
    const logArea = document.getElementById('logArea');
    const startBtn = document.getElementById('startBtn');
    const canvas = document.getElementById('hiddenCanvas');
    const ctx = canvas.getContext('2d');

    let csvData = [];
    let imageMap = {}; // key: 文件名(不带路径), value: File对象

    function log(msg) {
        logArea.innerHTML += `> ${msg}\n`;
        logArea.scrollTop = logArea.scrollHeight;
    }

    // 1. 解析 CSV
    document.getElementById('csvFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(evt) {
            const text = evt.target.result;
            const rows = text.split('\n');
            csvData = [];
            
            rows.forEach((row, index) => {
                if(!row.trim()) return;
                // 处理 CSV 可能的逗号分割 (简单处理)
                // 如果你的标题里有英文逗号，建议CSV用制表符分割，或者这里仅作简单分割
                const cols = row.split(',');
                if (cols.length >= 2) {
                    csvData.push({
                        fullPath: cols[0].trim(), // 第1列：原路径
                        title: (cols[1] || "").replace(/"/g, '').trim(), // 第2列：标题
                        tag1: (cols[2] || "").trim(), // 第3列：标签1
                        tag2: (cols[3] || "").trim()  // 第4列：标签2
                    });
                }
            });
            log(`✅ 已读取表格数据: ${csvData.length} 条`);
            checkReady();
        };
        // 尝试使用 GBK 读取中文，如果乱码请改为 UTF-8
        reader.readAsText(file, 'GBK'); 
    });

    // 2. 扫描文件夹 (深度扫描)
    document.getElementById('imageFolder').addEventListener('change', function(e) {
        const files = e.target.files;
        imageMap = {};
        let count = 0;
        
        log(`📂 正在扫描文件夹... (共检测到 ${files.length} 个文件)`);

        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            // 只处理图片
            if (file.type.startsWith('image/')) {
                // 关键逻辑：我们只存“文件名”，忽略路径
                // 比如 "11.8/abc.jpg" 我们只存 "abc.jpg"
                imageMap[file.name] = file;
                count++;
            }
        }
        log(`✅ 图片索引建立完成，有效图片: ${count} 张`);
        checkReady();
    });

    function checkReady() {
        if (csvData.length > 0 && Object.keys(imageMap).length > 0) {
            startBtn.disabled = false;
            startBtn.innerHTML = `🚀 开始匹配生成 (${csvData.length} 个任务)`;
        }
    }

    // 3. 执行生成
    startBtn.addEventListener('click', async function() {
        startBtn.disabled = true;
        const zip = new JSZip();
        const folder = zip.folder("小红书批量封面");
        let successCount = 0;

        log("--- 开始批量渲染 ---");

        for (let i = 0; i < csvData.length; i++) {
            const item = csvData[i];
            
            // 提取文件名逻辑
            // 无论表格里写的是 "D:\aaa\bbb.jpg" 还是 "bbb.jpg"
            // 我们都只取最后一部分 "bbb.jpg"
            let targetFileName = item.fullPath.split('\\').pop().split('/').pop();
            
            // 在上传的文件池里找这个名字
            const imgFile = imageMap[targetFileName];

            if (imgFile) {
                log(`[${i+1}/${csvData.length}] 正在处理: ${item.title}`);
                try {
                    // 使用统一的渲染参数
                    const blob = await renderCover(
                        imgFile, 
                        item.title, 
                        "网盘直发 | 4K修复 | 永久保存", // 副标题统一固定，或者你可以把第5列加进来
                        item.tag1 || "推荐", 
                        item.tag2 || "影视"
                    );
                    // 放入ZIP，用标题命名文件，方便查找
                    const safeTitle = item.title.replace(/[\\/:*?"<>|]/g, "_");
                    folder.file(`${safeTitle}.png`, blob);
                    successCount++;
                } catch (err) {
                    log(`❌ 渲染失败: ${err}`);
                }
            } else {
                log(`⚠️ 跳过: 表格中的文件 "${targetFileName}" 在上传的文件夹里没找到`);
            }
        }

        log(`--- 任务结束: 成功 ${successCount} 张 ---`);
        log("📦 正在打包 ZIP，请稍候...");
        
        zip.generateAsync({type:"blob"}).then(function(content) {
            saveAs(content, "封面打包_自动生成.zip");
            startBtn.disabled = false;
            startBtn.innerHTML = "✅ 下载完成";
        });
    });

    // --- 核心渲染逻辑 (保持 V2.0 风格不变) ---
    function renderCover(imgFile, title, subTitle, tag1, tag2) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    draw(img, title, subTitle, tag1, tag2);
                    canvas.toBlob(resolve, 'image/png');
                };
                img.onerror = reject;
                img.src = event.target.result;
            };
            reader.readAsDataURL(imgFile);
        });
    }

    function draw(img, title, subTitle, tag1, tag2) {
        // 清空
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. 背景模糊
        ctx.save();
        ctx.filter = 'blur(35px) brightness(0.65) saturate(1.2)';
        drawImageProp(ctx, img, 0, 0, canvas.width, canvas.height);
        ctx.restore();

        // 2. iPad 设备框
        const padW = 900, padH = 650;
        const padX = (canvas.width - padW) / 2;
        const padY = 380;

        ctx.shadowColor = "rgba(0,0,0,0.5)"; ctx.shadowBlur = 40; ctx.shadowOffsetY = 30;
        ctx.fillStyle = "#111";
        roundRect(ctx, padX, padY, padW, padH, 24, true, false);

        ctx.shadowColor = "transparent";
        const margin = 18;
        const sX = padX + margin, sY = padY + margin, sW = padW - margin*2, sH = padH - margin*2;
        
        ctx.save();
        roundRect(ctx, sX, sY, sW, sH, 8, false, false);
        ctx.clip();
        drawImageProp(ctx, img, sX, sY, sW, sH);
        ctx.restore();

        // 3. 放大镜
        const lensX = 540, lensY = 600, lensR = 130;
        ctx.save();
        ctx.beginPath();
        ctx.arc(lensX, lensY, lensR, 0, Math.PI*2);
        ctx.shadowColor = "rgba(0,0,0,0.4)"; ctx.shadowBlur = 20; ctx.lineWidth = 8; ctx.strokeStyle = "#fff";
        ctx.stroke(); ctx.clip();

        // 放大镜内容
        const zoomLevel = 2;
        const renderInfo = getDrawImagePropInfo(img, sX, sY, sW, sH);
        const relX = (lensX - renderInfo.x) / renderInfo.w;
        const relY = (lensY - renderInfo.y) / renderInfo.h;
        const zoomW = sW * zoomLevel, zoomH = sH * zoomLevel;
        const zoomX = lensX - (relX * zoomW);
        const zoomY = lensY - (relY * zoomH);

        ctx.filter = 'contrast(1.3) saturate(1.3) brightness(1.1)';
        ctx.drawImage(img, renderInfo.sx, renderInfo.sy, renderInfo.sw, renderInfo.sh, zoomX, zoomY, zoomW, zoomH);
        ctx.restore();

        // 放大镜角标
        drawBadge(ctx, lensX + 90, lensY + 100, "🔍 细节爆炸", "#ffcc00", "#000");

        // 4. 文字
        if(tag1) drawGlassTag(ctx, tag1, padX, padY - 35);
        if(tag2) drawGlassTag(ctx, tag2, padX + padW - 200, padY + padH - 25);

        ctx.textAlign = "center";
        ctx.shadowColor = "rgba(0,0,0,0.5)"; ctx.shadowBlur = 15; ctx.shadowOffsetY = 5;
        
        let fontSize = 85;
        if (title.length > 8) fontSize = 65;
        if (title.length > 12) fontSize = 55;
        ctx.font = `bold ${fontSize}px -apple-system, BlinkMacSystemFont, sans-serif`;
        ctx.fillStyle = "#fff";
        ctx.fillText(title, canvas.width / 2, 250);

        ctx.font = "500 32px sans-serif";
        ctx.fillStyle = "rgba(255,255,255,0.9)";
        ctx.shadowBlur = 0;
        ctx.fillText(subTitle, canvas.width / 2, 1150);
    }

    // 辅助工具
    function roundRect(ctx, x, y, w, h, r, f, s) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); if(f) ctx.fill(); if(s) ctx.stroke(); }
    function drawGlassTag(ctx, text, x, y) {
        if(!text) return;
        ctx.save(); ctx.font = "bold 26px sans-serif";
        const w = ctx.measureText(text).width + 40; const h = 56;
        ctx.fillStyle = "rgba(255, 255, 255, 0.2)"; ctx.strokeStyle = "rgba(255,255,255,0.3)"; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.roundRect(x, y, w, h, 28); ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(text, x + w/2, y + h/2 + 2); ctx.restore();
    }
    function drawBadge(ctx, x, y, text, bg, color) {
        ctx.save(); ctx.font = "bold 22px sans-serif";
        const w = ctx.measureText(text).width + 30;
        ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(x, y, w, 40, 20); ctx.fill();
        ctx.fillStyle = color; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(text, x + w/2, y + 22); ctx.restore();
    }
    function drawImageProp(ctx, img, x, y, w, h) {
        const info = getDrawImagePropInfo(img, x, y, w, h);
        ctx.drawImage(img, info.sx, info.sy, info.sw, info.sh, info.x, info.y, info.w, info.h);
    }
    function getDrawImagePropInfo(img, x, y, w, h) {
        var iw = img.width, ih = img.height, r = Math.min(w/iw, h/ih), nw = iw*r, nh = ih*r, ar = 1;
        if (nw < w) ar = w/nw; if (Math.abs(ar-1) < 1e-14 && nh < h) ar = h/nh;
        nw *= ar; nh *= ar;
        var cw = iw/(nw/w), ch = ih/(nh/h), cx = (iw-cw)*0.5, cy = (ih-ch)*0.5;
        if (cx < 0) cx = 0; if (cy < 0) cy = 0; if (cw > iw) cw = iw; if (ch > ih) ch = ih;
        return { sx: cx, sy: cy, sw: cw, sh: ch, x: x, y: y, w: nw, h: nh, iw:iw, ih:ih };
    }
</script>
</body>
</html>
