<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>小红书封面批量工厂 (修复乱码版)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f5f5f7; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        h1 { color: #ff2442; margin-top: 0; }
        .step { margin-bottom: 25px; padding-bottom: 20px; border-bottom: 1px dashed #eee; }
        .step h3 { margin: 0 0 10px 0; font-size: 16px; color: #555; }
        .upload-box { border: 2px dashed #ddd; padding: 20px; text-align: center; border-radius: 8px; cursor: pointer; transition: 0.2s; background: #fafafa; }
        #logArea { background: #1e1e1e; color: #0f0; font-family: "Consolas", monospace; padding: 15px; height: 300px; overflow-y: auto; border-radius: 8px; font-size: 12px; margin-bottom: 20px; white-space: pre-wrap; line-height: 1.5; }
        .btn { background: #ff2442; color: white; border: none; padding: 15px 40px; border-radius: 30px; font-weight: bold; font-size: 16px; cursor: pointer; width: 100%; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        
        /* 新增：编码选择器样式 */
        .encoding-select {
            padding: 8px; border-radius: 4px; border: 1px solid #ddd; background: #fff; margin-left: 10px; font-size: 13px; color: #333;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🏭 批量封面生成工厂 (修复乱码版)</h1>
    <p style="color:#666; font-size:13px;">如果日志里出现乱码，请尝试切换下方的“表格编码”选项，然后重新上传表格。</p>

    <div class="step">
        <h3>
            1. 上传 CSV 表格 
            <select id="encodingOpt" class="encoding-select">
                <option value="GBK" selected>编码：GBK (Excel默认)</option>
                <option value="UTF-8">编码：UTF-8 (通用)</option>
            </select>
        </h3>
        <p style="font-size:12px; color:#999;">⚠️ 只有4列数据：路径 | 标题 | 标签1 | 标签2</p>
        <input type="file" id="csvFile" accept=".csv" style="display:block; width:100%; padding:10px;">
    </div>

    <div class="step">
        <h3>2. 选择包含图片的“父级文件夹”</h3>
        <p style="font-size:12px; color:#999;">选中包含所有图片的那个大文件夹（例如 D:\浏览器下载安装）</p>
        <input type="file" id="imageFolder" webkitdirectory directory multiple style="display:block; width:100%; padding:10px;">
    </div>

    <div id="logArea">等待操作...</div>
    <button id="startBtn" class="btn" disabled>🚀 开始匹配并生成 ZIP</button>
</div>

<canvas id="hiddenCanvas" width="1080" height="1440" style="display:none;"></canvas>

<script>
    const logArea = document.getElementById('logArea');
    const startBtn = document.getElementById('startBtn');
    const canvas = document.getElementById('hiddenCanvas');
    const ctx = canvas.getContext('2d');
    const encodingSelect = document.getElementById('encodingOpt');

    let csvData = [];
    let imageMap = {}; 

    function log(msg, isError = false) {
        const color = isError ? '#ff4d4f' : '#0f0';
        logArea.innerHTML += `<span style="color:${color}">${msg}</span>\n`;
        logArea.scrollTop = logArea.scrollHeight;
    }

    // 监听编码切换，如果用户切换了编码，清空数据提示重新上传
    encodingSelect.addEventListener('change', () => {
        csvData = [];
        document.getElementById('csvFile').value = ''; 
        logArea.innerHTML = "已切换编码格式，请【重新上传】CSV表格文件！\n";
    });

    // 1. 解析 CSV (带编码控制)
    document.getElementById('csvFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const encoding = encodingSelect.value; // 获取当前选择的编码
        log(`正在尝试用 ${encoding} 格式读取表格...`);

        const reader = new FileReader();
        reader.onload = function(evt) {
            const text = evt.target.result;
            const rows = text.split('\n');
            csvData = [];
            
            // 预览前几行数据，检查是否乱码
            let previewLog = "";
            
            rows.forEach((row, index) => {
                if(!row.trim()) return;
                // 处理 CSV 逗号分割，同时处理可能存在的引号
                // 简单正则处理 CSV 列
                let cols = row.split(','); 
                
                if (cols.length >= 2) {
                    const fullPath = cols[0].trim();
                    const title = (cols[1] || "").replace(/"/g, '').trim();
                    
                    if(index < 3) {
                        previewLog += `   [预览第${index+1}行] 路径: ${fullPath} | 标题: ${title}\n`;
                    }

                    csvData.push({
                        fullPath: fullPath,
                        title: title,
                        tag1: (cols[2] || "").replace(/"/g, '').trim(),
                        tag2: (cols[3] || "").replace(/"/g, '').trim()
                    });
                }
            });

            log(previewLog);
            if (previewLog.includes("")) {
                log("❌ 检测到乱码！请在上方的下拉菜单切换编码格式 (GBK <-> UTF-8)，然后重新上传表格！", true);
                csvData = []; // 清空错误数据
            } else {
                log(`✅ 表格读取成功: ${csvData.length} 条数据 (无乱码)`);
            }
            checkReady();
        };
        
        reader.onerror = () => log("读取文件失败", true);
        reader.readAsText(file, encoding); 
    });

    // 2. 扫描文件夹
    document.getElementById('imageFolder').addEventListener('change', function(e) {
        const files = e.target.files;
        imageMap = {};
        let count = 0;
        
        log(`📂 正在扫描文件夹... (检测到 ${files.length} 个文件)`);

        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            if (file.type.startsWith('image/')) {
                // 只存文件名
                imageMap[file.name] = file;
                count++;
            }
        }
        log(`✅ 图片索引建立完成，有效图片: ${count} 张`);
        checkReady();
    });

    function checkReady() {
        if (csvData.length > 0 && Object.keys(imageMap).length > 0) {
            startBtn.disabled = false;
            startBtn.innerHTML = `🚀 开始匹配生成 (${csvData.length} 个任务)`;
        } else {
            startBtn.disabled = true;
        }
    }

    // 3. 执行生成
    startBtn.addEventListener('click', async function() {
        startBtn.disabled = true;
        const zip = new JSZip();
        const folder = zip.folder("小红书批量封面");
        let successCount = 0;
        let failCount = 0;

        log("--- 开始批量渲染 ---");

        for (let i = 0; i < csvData.length; i++) {
            const item = csvData[i];
            
            // 提取文件名
            let targetFileName = item.fullPath.split('\\').pop().split('/').pop();
            targetFileName = targetFileName.replace(/"/g, '').trim(); // 清理可能的引号

            const imgFile = imageMap[targetFileName];

            if (imgFile) {
                log(`[${i+1}/${csvData.length}] 正在处理: ${item.title}`);
                try {
                    const blob = await renderCover(
                        imgFile, 
                        item.title, 
                        "网盘直发 | 4K修复 | 永久保存", 
                        item.tag1 || "推荐", 
                        item.tag2 || "影视"
                    );
                    const safeTitle = (item.title || "未命名").replace(/[\\/:*?"<>|]/g, "_");
                    folder.file(`${safeTitle}.png`, blob);
                    successCount++;
                } catch (err) {
                    log(`❌ 渲染错误: ${err}`, true);
                }
            } else {
                failCount++;
                // 仅显示前5个找不到的错误，避免刷屏
                if(failCount < 5) {
                    log(`⚠️ 跳过: 没找到图片 "${targetFileName}" (请检查表格里的文件名是否和文件夹里的一致)`, true);
                }
            }
        }

        if(failCount >= 5) log(`... 还有 ${failCount - 5} 张图片未找到，已省略显示。`, true);

        log(`--- 任务结束: 成功 ${successCount} 张，失败 ${failCount} 张 ---`);
        
        if (successCount > 0) {
            log("📦 正在打包 ZIP，请稍候...");
            zip.generateAsync({type:"blob"}).then(function(content) {
                saveAs(content, "封面打包_修复版.zip");
                startBtn.disabled = false;
                startBtn.innerHTML = "✅ 下载完成";
            });
        } else {
            log("❌ 没有生成任何图片，请检查乱码或文件名匹配问题。", true);
            startBtn.disabled = false;
        }
    });

    // --- 渲染逻辑 (保持不变) ---
    function renderCover(imgFile, title, subTitle, tag1, tag2) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    draw(img, title, subTitle, tag1, tag2);
                    canvas.toBlob(resolve, 'image/png');
                };
                img.onerror = reject;
                img.src = event.target.result;
            };
            reader.readAsDataURL(imgFile);
        });
    }

    function draw(img, title, subTitle, tag1, tag2) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        // 背景
        ctx.save();
        ctx.filter = 'blur(35px) brightness(0.65) saturate(1.2)';
        drawImageProp(ctx, img, 0, 0, canvas.width, canvas.height);
        ctx.restore();
        // iPad
        const padW = 900, padH = 650;
        const padX = (canvas.width - padW) / 2;
        const padY = 380;
        ctx.shadowColor = "rgba(0,0,0,0.5)"; ctx.shadowBlur = 40; ctx.shadowOffsetY = 30;
        ctx.fillStyle = "#111";
        roundRect(ctx, padX, padY, padW, padH, 24, true, false);
        ctx.shadowColor = "transparent";
        const margin = 18;
        const sX = padX + margin, sY = padY + margin, sW = padW - margin*2, sH = padH - margin*2;
        ctx.save();
        roundRect(ctx, sX, sY, sW, sH, 8, false, false);
        ctx.clip();
        drawImageProp(ctx, img, sX, sY, sW, sH);
        ctx.restore();
        // 放大镜
        const lensX = 540, lensY = 600, lensR = 130;
        ctx.save();
        ctx.beginPath();
        ctx.arc(lensX, lensY, lensR, 0, Math.PI*2);
        ctx.shadowColor = "rgba(0,0,0,0.4)"; ctx.shadowBlur = 20; ctx.lineWidth = 8; ctx.strokeStyle = "#fff";
        ctx.stroke(); ctx.clip();
        const zoomLevel = 2;
        const renderInfo = getDrawImagePropInfo(img, sX, sY, sW, sH);
        const relX = (lensX - renderInfo.x) / renderInfo.w;
        const relY = (lensY - renderInfo.y) / renderInfo.h;
        const zoomW = sW * zoomLevel, zoomH = sH * zoomLevel;
        const zoomX = lensX - (relX * zoomW);
        const zoomY = lensY - (relY * zoomH);
        ctx.filter = 'contrast(1.3) saturate(1.3) brightness(1.1)';
        ctx.drawImage(img, renderInfo.sx, renderInfo.sy, renderInfo.sw, renderInfo.sh, zoomX, zoomY, zoomW, zoomH);
        ctx.restore();
        // 标签
        drawBadge(ctx, lensX + 90, lensY + 100, "🔍 细节爆炸", "#ffcc00", "#000");
        if(tag1) drawGlassTag(ctx, tag1, padX, padY - 35);
        if(tag2) drawGlassTag(ctx, tag2, padX + padW - 200, padY + padH - 25);
        ctx.textAlign = "center";
        ctx.shadowColor = "rgba(0,0,0,0.5)"; ctx.shadowBlur = 15; ctx.shadowOffsetY = 5;
        let fontSize = 85;
        if (title.length > 8) fontSize = 65;
        if (title.length > 12) fontSize = 55;
        ctx.font = `bold ${fontSize}px -apple-system, BlinkMacSystemFont, sans-serif`;
        ctx.fillStyle = "#fff";
        ctx.fillText(title, canvas.width / 2, 250);
        ctx.font = "500 32px sans-serif";
        ctx.fillStyle = "rgba(255,255,255,0.9)";
        ctx.shadowBlur = 0;
        ctx.fillText(subTitle, canvas.width / 2, 1150);
    }

    function roundRect(ctx, x, y, w, h, r, f, s) { ctx.beginPath(); ctx.roundRe
