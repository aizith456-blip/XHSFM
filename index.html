<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>小红书封面工厂 (V9.0 终极氛围版)</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #e0e5ec; padding: 20px; color: #333; }
        .container { max-width: 950px; margin: 0 auto; background: white; padding: 40px; border-radius: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.08); }
        h1 { color: #222; margin-top: 0; font-weight: 900; letter-spacing: -0.5px; background: linear-gradient(45deg, #ff2442, #ff5e7e); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .step { margin-bottom: 25px; padding: 25px; background: #f7f9fc; border-radius: 16px; border: 1px solid #edf2f7; transition: 0.3s; }
        .step:hover { box-shadow: 0 5px 15px rgba(0,0,0,0.03); transform: translateY(-2px); }
        
        #previewBox {
            background: #fff; border: 2px dashed #dde2e6; padding: 15px;
            margin-top: 15px; border-radius: 8px; font-family: monospace; font-size: 13px; color: #666;
        }

        #logArea { 
            background: #1a1b1e; color: #4ade80; font-family: monospace; 
            padding: 20px; height: 160px; overflow-y: auto; 
            border-radius: 12px; font-size: 12px; margin-bottom: 25px; border: 4px solid #f0f0f0;
        }

        .btn { background: linear-gradient(135deg, #ff2442 0%, #ff6b81 100%); color: white; border: none; padding: 18px 40px; border-radius: 14px; font-weight: 700; font-size: 18px; cursor: pointer; width: 100%; transition: 0.3s; box-shadow: 0 10px 25px rgba(255, 36, 66, 0.3); }
        .btn:disabled { background: #cbd5e1; box-shadow: none; cursor: not-allowed; }
        .btn:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(255, 36, 66, 0.4); }
        
        .encoding-select { padding: 8px; margin-left: 10px; border-radius: 6px; border: 1px solid #ccc; }
        
        /* 控制条样式 */
        .control-panel { display: flex; gap: 30px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
        .control-item { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; color: #555; }
        
        input[type="range"] {
            -webkit-appearance: none; width: 150px; height: 6px; background: #e2e8f0; border-radius: 5px; outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #ff2442; cursor: pointer; box-shadow: 0 2px 6px rgba(255,36,66,0.4);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎨 封面工厂 V9.0 <span style="font-size:0.6em; color:#999; -webkit-text-fill-color:#999;">终极氛围版</span></h1>
    <p style="color:#666; margin-bottom:30px;">专治“牛皮癣”广告，自动生成环境光背景，打造电影级质感。</p>
    
    <!-- 步骤 1 -->
    <div class="step">
        <h3>1. 上传 CSV 表格 
            <select id="encodingOpt" class="encoding-select">
                <option value="GBK" selected>GBK</option>
                <option value="UTF-8">UTF-8</option>
            </select>
        </h3>
        <input type="file" id="csvFile" accept=".csv" onclick="this.value=null" style="display:block; width:100%; padding:10px;">
        <div id="previewBox">等待上传...</div>
    </div>

    <!-- 步骤 2 -->
    <div class="step">
        <h3>2. 选择图片文件夹</h3>
        <input type="file" id="imageFolder" webkitdirectory directory multiple onclick="this.value=null" style="display:block; width:100%; padding:10px;">
    </div>
    
    <!-- 步骤 3 -->
    <div class="step">
        <h3>3. 美化控制台 (关键设置)</h3>
        <div class="control-panel">
            <div class="control-item">
                🔍 暴力去广告缩放: 
                <input type="range" id="zoomLevel" min="1.0" max="2.0" step="0.1" value="1.3">
                <span id="zoomVal" style="color:#ff2442">1.3x</span>
            </div>
            
            <div class="control-item">
                <label style="cursor:pointer; display:flex; align-items:center; gap:5px;">
                    <input type="checkbox" id="dynamicBg" checked> 🌈 开启环境光背景
                </label>
            </div>

            <div class="control-item">
                <label style="cursor:pointer; display:flex; align-items:center; gap:5px;">
                    <input type="checkbox" id="showGlass" checked> 🔎 显示中心放大镜
                </label>
            </div>
        </div>
        <p style="font-size:12px; color:#888; margin-top:10px;">* 如果广告条特别宽，请把缩放拉大到 1.5x 以上</p>
    </div>

    <div id="logArea">系统就绪。</div>
    <button id="startBtn" class="btn" disabled>🎨 生成终极封面</button>
</div>

<canvas id="hiddenCanvas" width="1080" height="1440" style="display:none;"></canvas>

<script>
    const logArea = document.getElementById('logArea');
    const previewBox = document.getElementById('previewBox');
    const startBtn = document.getElementById('startBtn');
    const canvas = document.getElementById('hiddenCanvas');
    const ctx = canvas.getContext('2d');
    const encodingSelect = document.getElementById('encodingOpt');
    const zoomSlider = document.getElementById('zoomLevel');
    const zoomVal = document.getElementById('zoomVal');

    let csvData = [];
    let imageMap = {}; 

    function log(msg) {
        logArea.innerHTML += `<div>> ${msg}</div>`;
        logArea.scrollTop = logArea.scrollHeight;
    }

    // 缩放数值显示
    zoomSlider.oninput = function() { zoomVal.innerText = this.value + "x"; }

    function cleanFileName(path) {
        if (!path) return "";
        let name = path.replace(/\\/g, '/').split('/').pop();
        return name.replace(/"/g, '').trim();
    }

    function cleanTitleText(text) {
        // 深度清洗标题
        let clean = text.replace(/\?\?/g, "")
                        .replace(/SOS/ig, "")
                        .replace(/【.*?】/g, "")
                        .replace(/（.*?）/g, "") // 去除中文括号内容
                        .replace(/[^\u4e00-\u9fa5a-zA-Z0-9]$/, ""); 
        return clean.trim();
    }

    encodingSelect.addEventListener('change', () => {
        csvData = [];
        previewBox.innerHTML = "🔄 编码已切换，请重新上传文件...";
    });

    // 1. CSV
    document.getElementById('csvFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(evt) {
            const text = evt.target.result;
            if (text.substring(0, 10).includes("PK")) { alert("请上传CSV！"); return; }
            
            const lines = text.split('\n').filter(line => line.trim() !== "");
            let previewText = "📋 预览:\n";
            for(let i=0; i<Math.min(3, lines.length); i++) previewText += `[${i+1}] ${lines[i].substring(0, 50)}\n`;
            previewBox.innerText = previewText;

            csvData = [];
            lines.forEach(row => {
                let cols = row.split(',');
                if (cols.length >= 2) {
                    csvData.push({
                        matchKey: cleanFileName(cols[0]), 
                        title: (cols[1] || "").replace(/"/g, '').trim(),
                        tag1: (cols[2] || "").replace(/"/g, '').trim(),
                        tag2: (cols[3] || "").replace(/"/g, '').trim()
                    });
                }
            });
            log(`✅ 表格加载：${csvData.length} 条`);
            checkReady();
        };
        reader.readAsText(file, encodingSelect.value);
    });

    // 2. Folder
    document.getElementById('imageFolder').addEventListener('change', function(e) {
        const files = e.target.files;
        imageMap = {};
        let count = 0;
        for (let i = 0; i < files.length; i++) {
            if (files[i].type.startsWith('image/')) {
                imageMap[cleanFileName(files[i].name)] = files[i];
                count++;
            }
        }
        log(`📂 图片加载：${count} 张`);
        checkReady();
    });

    function checkReady() {
        if (csvData.length > 0 && Object.keys(imageMap).length > 0) {
            startBtn.disabled = false;
        }
    }

    // 3. Generate
    startBtn.addEventListener('click', async function() {
        startBtn.disabled = true;
        startBtn.innerHTML = "⏳ 正在渲染光影...";
        const zip = new JSZip();
        const folder = zip.folder("V9_氛围感封面");
        let success = 0;
        
        // 获取用户设置
        const config = {
            scale: parseFloat(zoomSlider.value),
            useDynamicBg: document.getElementById('dynamicBg').checked,
            showLens: document.getElementById('showGlass').checked
        };

        for (let i = 0; i < csvData.length; i++) {
            const item = csvData[i];
            if (imageMap[item.matchKey]) {
                try {
                    const finalTitle = cleanTitleText(item.title);
                    const blob = await renderUltimateCover(imageMap[item.matchKey], finalTitle, "沉浸式观影 | 4K修复", item.tag1, item.tag2, config);
                    let safeTitle = (finalTitle || "img_"+i).replace(/[\\/:*?"<>|]/g, "_");
                    folder.file(`${safeTitle}.png`, blob);
                    success++;
                } catch(e) { console.error(e); }
            }
        }
        
        if(success > 0) {
            zip.generateAsync({type:"blob"}).then(content => {
                saveAs(content, "封面_V9终极版.zip");
                startBtn.innerHTML = "✅ 下载完成";
                startBtn.disabled = false;
            });
        } else {
            alert("失败");
            startBtn.disabled = false;
        }
    });

    // --- 🎨 V9.0 核心引擎：终极氛围版 ---
    function renderUltimateCover(file, title, subtitle, tag1, tag2, config) {
        return new Promise(resolve => {
            const img = new Image();
            img.onload = () => {
                ctx.clearRect(0, 0, 1080, 1440);

                // 1. 背景层：动态环境光 vs 高级灰
                if (config.useDynamicBg) {
                    // 绘制全图并极度模糊，提取氛围色
                    ctx.save();
                    ctx.filter = 'blur(80px) brightness(0.8) saturate(1.2)';
                    // 稍微放大一点去除白边
                    ctx.drawImage(img, -100, -100, 1280, 1640); 
                    ctx.restore();
                    
                    // 叠加一层白色渐变，保证文字清晰度
                    const grad = ctx.createLinearGradient(0, 0, 0, 1440);
                    grad.addColorStop(0, "rgba(255,255,255,0.2)");
                    grad.addColorStop(1, "rgba(0,0,0,0.4)");
                    ctx.fillStyle = grad;
                    ctx.fillRect(0,0,1080,1440);
                } else {
                    ctx.fillStyle = "#f0f2f5";
                    ctx.fillRect(0,0,1080,1440);
                }

                // 2. iPad 悬浮容器
                const padW = 880; 
                const padH = 660; // 4:3
                const padX = (1080 - padW) / 2;
                const padY = 360;

                // 2.1 弥散阴影 (更柔和)
                ctx.save();
                ctx.shadowColor = "rgba(0,0,0,0.4)";
                ctx.shadowBlur = 80;
                ctx.shadowOffsetY = 40;
                ctx.fillStyle = "#000";
                roundRect(ctx, padX + 20, padY + 20, padW - 40, padH - 40, 40, true);
                ctx.restore();

                // 2.2 机身边框 (极窄黑边)
                ctx.fillStyle = "#111";
                roundRect(ctx, padX, padY, padW, padH, 20, true);

                // 2.3 屏幕区域
                const sx = padX + 12;
                const sy = padY + 12;
                const sw = padW - 24;
                const sh = padH - 24;

                ctx.save();
                roundRect(ctx, sx, sy, sw, sh, 12, false);
                ctx.clip();

                // 🔥 核心：去广告强力缩放
                // 默认 1.3 倍，用户可拉到 2.0 倍
                drawImageZoom(ctx, img, sx, sy, sw, sh, config.scale);

                // 2.4 屏幕反光 (提升质感)
                const gloss = ctx.createLinearGradient(sx, sy, sx + sw, sy + sh);
                gloss.addColorStop(0, "rgba(255,255,255,0.1)");
                gloss.addColorStop(0.4, "rgba(255,255,255,0)");
                gloss.addColorStop(1, "rgba(255,255,255,0)");
                ctx.fillStyle = gloss;
                ctx.fillRect(sx, sy, sw, sh);

                // 2.5 视频进度条 (白色极简)
                ctx.fillStyle = "rgba(0,0,0,0.3)";
                ctx.fillRect(sx, sy + sh - 80, sw, 80); // 底部渐变遮罩
                
                ctx.fillStyle = "rgba(255,255,255,0.3)";
                ctx.fillRect(sx + 40, sy + sh - 40, sw - 80, 4);
                ctx.fillStyle = "#fff"; // 纯白进度条更高级
                ctx.fillRect(sx + 40, sy + sh - 40, (sw-80) * 0.45, 4);
                
                ctx.restore();

                // 3. 放大镜 (强制居中)
                if (config.showLens) {
                    const lensR = 120;
                    // 放在右下角稍微偏上的位置
                    const lensX = padX + padW - 50; 
                    const lensY = padY + padH - 30;

                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(lensX, lensY, lensR, 0, Math.PI*2);
                    // 金色/白色边框，增加贵气
                    ctx.lineWidth = 6; 
                    ctx.strokeStyle = "#fff"; 
                    ctx.shadowColor="rgba(0,0,0,0.3)"; ctx.shadowBlur=20;
                    ctx.stroke(); ctx.clip();

                    // 放大哪里？放大【画面正中心】！
                    // 不要放大右下角，因为那里通常是字幕或者水印
                    // 计算原图在缩放后的中心点
                    drawImageZoom(ctx, img, lensX-lensR*2, lensY-lensR*2, lensR*4, lensR*4, config.scale * 2.5); // 放大2.5倍
                    
                    ctx.restore();
                    
                    // 标签
                    drawPill(ctx, lensX - 60, lensY + 95, "✨ 4K修复", "#000", "#fff");
                }

                // 4. 文字排版
                ctx.textAlign = "center";
                
                // 顶部标签 (毛玻璃效果)
                const tagY = 220;
                if (tag1) drawBlurTag(ctx, tag1, 540 - 150, tagY);
                if (tag2) drawBlurTag(ctx, tag2, 540 + 150, tagY);

                // 主标题 (带发光投影)
                ctx.textBaseline = "middle";
                ctx.fillStyle = "#fff"; 
                ctx.shadowColor = "rgba(0,0,0,0.6)"; ctx.shadowBlur = 15; ctx.shadowOffsetY = 4;
                
                let fontSize = 85;
                if(title.length > 8) fontSize = 65;
                if(title.length > 12) fontSize = 55;
                ctx.font = `900 ${fontSize}px "PingFang SC", "Microsoft YaHei", sans-serif`;
                ctx.fillText(title, 540, 115);

                // 底部信息
                ctx.shadowColor = "transparent";
                ctx.textBaseline = "bottom";
                ctx.font = "600 32px sans-serif";
                ctx.fillStyle = "rgba(255,255,255,0.95)";
                
                // 简单的装饰线条
                ctx.beginPath();
                ctx.moveTo(490, 1140); ctx.lineTo(590, 1140);
                ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.lineWidth=2; ctx.stroke();
                
                ctx.fillText(subtitle, 540, 1120);
                
                // 底部水印
                ctx.font = "400 22px sans-serif";
                ctx.fillStyle = "rgba(255,255,255,0.5)";
                ctx.fillText("@洋宝贝影视 · 独家整理", 540, 1380);

                canvas.toBlob(blob => resolve(blob), 'image/png');
            };
            img.src = URL.createObjectURL(file);
        });
    }

    // --- 辅助函数 ---
    
    // 带缩放的裁切绘制
    function drawImageZoom(ctx, img, x, y, w, h, scale) {
        var iw = img.width, ih = img.height;
        // 基础 Cover 比例
        var r = Math.max(w / iw, h / ih); 
        // 叠加用户自定义缩放 (scale)
        var finalScale = r * scale;
        
        var nw = iw * finalScale;
        var nh = ih * finalScale;
        
        // 始终居中
        var cx = (w - nw) * 0.5;
        var cy = (h - nh) * 0.5;
        
        ctx.drawImage(img, x + cx, y + cy, nw, nh); 
    }

    function roundRect(ctx, x, y, w, h, r, fill) {
        ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
        if(fill) ctx.fill(); else ctx.stroke();
    }

    function drawBlurTag(ctx, text, x, y) {
        ctx.save();
        ctx.font = "bold 26px sans-serif";
        const w = ctx.measureText(text).width + 50;
        const h = 54;
        
        // 黑色半透明背景
        ctx.fillStyle = "rgba(0,0,0,0.6)";
        ctx.shadowColor = "rgba(0,0,0,0.2)"; ctx.shadowBlur = 10;
        ctx.beginPath(); ctx.roundRect(x - w/2, y, w, h, 27); ctx.fill();
        
        // 描边
        ctx.strokeStyle = "rgba(255,255,255,0.3)"; ctx.lineWidth = 1; ctx.stroke();

        ctx.fillStyle = "#fff"; ctx.shadowBlur = 0;
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(text, x, y + h/2 + 2);
        ctx.restore();
    }

    function drawPill(ctx, x, y, text, bg, color) {
        ctx.save();
        ctx.font = "bold 24px sans-serif";
        const w = ctx.measureText(text).width + 30;
        ctx.fillStyle = bg;
        ctx.beginPath(); ctx.roundRect(x, y, w, 44, 22); ctx.fill();
        ctx.fillStyle = color;
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(text, x + w/2, y + 24);
        ctx.restore();
    }
</script>
</body>
</html>
